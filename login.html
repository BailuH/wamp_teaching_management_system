<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧法大 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* 整体布局 */
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 左侧图片区 */
        .left-panel {
            flex: 1;
            /* 这里使用网络图片作为占位，您可以替换为您本地的玉兰花背景图路径，例如 url('bg.jpg') */
            background-image: url('https://images.unsplash.com/photo-1550985616-10810253b84d?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* 左上角Logo区 */
        .logo-area {
            display: flex;
            align-items: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            color: #8c0e20;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .logo-text p {
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* 左侧底部标语 */
        .slogan {
            text-align: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.6);
            margin-bottom: 50px;
        }

        .slogan span {
            display: block;
            font-size: 24px;
            margin-top: 10px;
            letter-spacing: 6px;
            font-weight: normal;
        }

        /* 右侧登录区 */
        .right-panel {
            width: 420px;
            background-color: #fcfaf8; /* 浅米色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 40px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        /* 账号登录区 */
        .login-section {
            width: 100%;
            margin-bottom: 40px;
        }

        .section-title {
            color: #8c0e20;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            background: #fff;
            border: 1px solid #d2a6a6; /* 浅红色边框 */
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            height: 50px;
            transition: border-color 0.3s;
        }

        .input-group:focus-within {
            border-color: #8c0e20;
            box-shadow: 0 0 5px rgba(140, 14, 32, 0.2);
        }

        .input-group svg {
            width: 18px;
            height: 18px;
            fill: #8c0e20;
            margin-right: 10px;
        }

        .input-group input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 15px;
            color: #333;
            background: transparent;
        }

        .input-group input::placeholder {
            color: #999;
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            background-color: #8c0e20;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #70101b;
        }

        .forgot-pwd {
            display: block;
            text-align: right;
            margin-top: 10px;
            font-size: 13px;
            color: #333;
            text-decoration: none;
        }

        .forgot-pwd:hover {
            color: #8c0e20;
        }

        /* 扫码登录区 */
        .scan-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qrcode-box {
            width: 100%;
            border: 1px solid #eee;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
        }

        .wechat-header {
            background-color: #48a34c; /* 微信绿 */
            color: #fff;
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .qrcode-image {
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .qrcode-image img {
            max-width: 100%;
            max-height: 100%;
        }

        .scan-tip {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }

        /* 隐藏滚动条 */
        .right-panel::-webkit-scrollbar {
            display: none;
        }

        /* 响应式适配 */
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }
            .left-panel {
                display: none; /* 小屏幕隐藏左侧背景 */
            }
            .right-panel {
                width: 100%;
                height: 100vh;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

                <div class="logo-text">

                    <input type="password" name="password" placeholder="密码" autocomplete="current-password" required>

                <button type="submit" class="btn-submit">立即登录</button>
                <a href="#" class="forgot-pwd">忘记密码</a>

            </form>

            <!-- 扫码登录 -->
            <div class="scan-section">
                <div class="section-title">扫码登录</div>
                
                <div class="qrcode-box">

                        微信扫码登录

                    <div class="qrcode-image">

    </div>

    <script>
      (function(){
        var p = new URLSearchParams(location.search);
        if (p.get('err') === '1') {
