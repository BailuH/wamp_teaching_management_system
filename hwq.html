<h2>学生信息录入</h2>
<form class="form-card" action="add_student.php" method="post">
  <div class="form-row">
    <label for="xh">学号</label>
    <input type="text" id="xh" name="xh" required>
  </div>
  <div class="form-row">
    <label for="xm">姓名</label>
    <input type="text" id="xm" name="xm" required>

  <div class="form-row">
    <label for="xb">性别</label>
    <input type="text" id="xb" name="xb" placeholder="男 / 女">
  </div>
  <div class="form-row">
    <label for="csrq">出生日期</label>
    <input type="date" id="csrq" name="csrq">
  </div>
  <div class="form-row">
    <label for="loan_price">贷款金额</label>
    <input type="text" id="loan_price" name="loan_price" placeholder="没有则填 0">
  </div>

    <input type="submit" value="提交">
    <input type="reset" value="重置">
  </div>
